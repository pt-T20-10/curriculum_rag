version: '3.8'

services:
  # ==================== MySQL Database ====================
  # Fresh local setup note:
  # - This service creates the database and loads backend/scripts/init.sql.
  # - When the backend starts, development bootstrap settings come from .env.
  mysql:
    image: mysql:8.0
    container_name: ai_textbook_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_local_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_textbook_db}
      MYSQL_USER: ${MYSQL_USER:-textbook_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_local_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - textbook_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # ==================== Redis (for Celery - Future) ====================
  redis:
    image: redis:7-alpine
    container_name: ai_textbook_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - textbook_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  # ==================== phpMyAdmin (Optional - for DB management) ====================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ai_textbook_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-textbook_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-change_me_local_password}
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - textbook_network

volumes:
  mysql_data:
    driver: local

networks:
  textbook_network:
    driver: bridge
