name: curriculum-rag-demo

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: curriculum-rag-backend:${IMAGE_TAG:-demo}
  env_file:
    - ${PRODUCTION_ENV_FILE:-.env.production}
  restart: unless-stopped
  networks:
    - app_network
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --innodb-buffer-pool-size=134217728
      - --max-connections=30
      - --performance-schema=OFF
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 384m
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 128m
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *backend-common
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      mysql:
        condition: service_healthy

  api:
    <<: *backend-common
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --proxy-headers
      - --forwarded-allow-ips=*
    volumes:
      - outputs_data:/app/outputs
      - logs_data:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  worker:
    <<: *backend-common
    init: true
    command: ["sh", "-c", "test \"$${CELERY_CONCURRENCY}\" = \"1\" && celery -A app.celery_app.celery_app worker --loglevel=INFO --pool=solo --concurrency=1"]
    volumes:
      - outputs_data:/app/outputs
      - logs_data:/app/logs
      - chroma_data:/app/data/chroma_db
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 2m
    mem_limit: 1100m

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ""
    image: curriculum-rag-web:${IMAGE_TAG:-demo}
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  mysql_data:
  redis_data:
  outputs_data:
  logs_data:
  chroma_data:
  caddy_data:
  caddy_config:

networks:
  app_network:
    driver: bridge
